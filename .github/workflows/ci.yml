name: OmniRAG CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DEBUG: "true"
      DEFAULT_EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check . --exit-zero

      - name: Run Pytest Test Suite
        run: |
          python -c "
          import subprocess, sys
          res = subprocess.run([sys.executable, '-m', 'pytest', 'tests/', '-v', '-ra', '--tb=short'], capture_output=True, text=True)
          print(res.stdout)
          print(res.stderr)
          if res.returncode != 0:
              for line in (res.stdout + '\n' + res.stderr).splitlines()[-30:]:
                  if line.strip():
                      print(f'::error title=Pytest Diagnostic::{line}')
          sys.exit(res.returncode)
          "

  frontend-build:
    name: Frontend Lint & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check & Build
        run: |
          cd frontend
          npm run build

